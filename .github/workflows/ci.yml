name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['3.13.1', stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart doc --validate-links
      - run: dart pub publish --dry-run
      - name: Verify tracked lockfile
        run: |
          if git check-ignore pubspec.lock; then exit 1; fi
          git ls-files --error-unmatch pubspec.lock
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4, pinned to an immutable commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify complete history
        run: test "$(git rev-parse --is-shallow-repository)" = false
      - name: Scan history and checkout
        run: |
          gitleaks_bin_dir=$(mktemp -d)
          trap 'rm -rf "$gitleaks_bin_dir"' EXIT
          ./tool/install_gitleaks.sh "$gitleaks_bin_dir"
          "$gitleaks_bin_dir/gitleaks" version | grep '8.30.1'
          "$gitleaks_bin_dir/gitleaks" git --redact --config .gitleaks.toml
          "$gitleaks_bin_dir/gitleaks" dir --redact --config .gitleaks.toml .
